site_name: Freestyle Swimming Mastery
site_description: Bộ sách chuyên khảo & Cơ sở tri thức Bơi Sải Hiện Đại — Tốc độ < 1:30/100m, Tay nhẹ, Lực từ thân
site_url: https://gadoi.github.io/boisaiskill/
repo_url: https://github.com/gadoi/boisaiskill
repo_name: gadoi/boisaiskill

docs_dir: .
site_dir: ../_site

exclude_docs: |
  .git/
  .github/
  .obsidian/
  site/
  mkdocs.yml
  requirements-docs.txt
  .gitignore
  FILE_TEMPLATE.md

theme:
  name: material
  language: vi
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Trang Chủ:
      - Giới Thiệu: README.md
      - Obsidian Home: Home.md
      - Tổng Hợp Nhanh (skill.md): skill.md
      - Mục Lục Tổng: SUMMARY.md
      - Thư Viện Hình Minh Họa: images/README.md
  - I. Nền Tảng Khoa Học:
      - 01. Vật Lý Bơi & Công Suất v³: 01-foundation/physics-of-swimming.md
      - 01. Trọng Tâm (COG) & Tâm Nổi (COB): 01-foundation/center-of-gravity-and-buoyancy.md
      - 02. Chuỗi Truyền Lực (Kinetic Chain): 02-biomechanics/kinetic-chain.md
      - 02. Cơ Sinh Học Vai & Cơ Xô (Lat): 02-biomechanics/shoulder-and-lat-mechanics.md
      - 03. Giảm Lực Cản Thủy Động: 03-hydrodynamics/drag-reduction.md
      - 03. Lực Đẩy, Lực Nâng & Xoáy Nước: 03-hydrodynamics/propulsion-and-lift.md
