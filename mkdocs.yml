site_name: Làm Chủ Bơi Sải Hiện Đại (Freestyle Swimming Mastery)
site_description: Bộ sách chuyên khảo & Cơ sở tri thức Bơi Sải Hiện Đại — Tốc độ < 1:30/100m, Tay nhẹ, Lực từ thân
site_url: https://gadoi.github.io/boisaiskill/
repo_url: https://github.com/gadoi/boisaiskill
repo_name: gadoi/boisaiskill

docs_dir: .
site_dir: ../_site

exclude_docs: |
  .git/
  .github/
  .obsidian/
  _site/
  _mkdocs_src/
  mkdocs.yml
  requirements-docs.txt
  .gitignore
  FILE_TEMPLATE.md

theme:
  name: material
  language: vi
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

